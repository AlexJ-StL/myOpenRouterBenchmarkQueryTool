[project]
name = "my-openrouter-benchmark-query-tool"
version = "0.1.0"
description = "Quick CLI to query the OpenRouter benchmark catalog and find models for a task."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
benchmarks = "benchmarks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
