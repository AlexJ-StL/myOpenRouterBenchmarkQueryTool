[project]
name = "my-openrouter-benchmark-query-tool"
version = "0.1.0"
description = "Quick CLI to query the OpenRouter benchmark catalog and find models for a task."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyright>=1.1",
]

[project.scripts]
benchmarks = "benchmarks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=benchmarks --cov=benchmark_catalog"

[tool.pyright]
pythonVersion = "3.13"
reportMissingTypeStubs = false
reportMissingImports = false
reportUnusedVariable = true
reportUnusedImport = true
reportDuplicateImport = true
